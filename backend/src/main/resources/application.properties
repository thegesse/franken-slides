spring.application.name=backend

# ===================================
# Database Connection (AWS RDS)
# ===================================
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================
# JPA / Hibernate Production Settings
# ===================================
# Using 'update' automatically creates/updates tables on startup.
# Switch to 'validate' once your schema is finalized in production for extra safety.
spring.jpa.hibernate.ddl-auto=create

# Database dialect (Spring Boot auto-detects this for PostgreSQL, but you can explicitly set it if needed)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Set to true only if you need to debug SQL queries in your Beanstalk logs
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================
# Connection Pool (HikariCP - Default)
# ===================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

server.port=${PORT:8080}
