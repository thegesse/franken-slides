name: Frontend-test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/my-react-app/package-lock.json
      - run: npm ci
        working-directory: frontend/my-react-app
      
      - run: npm run lint
        working-directory: frontend/my-react-app
      
      - run: npm run build
        working-directory: frontend/my-react-app