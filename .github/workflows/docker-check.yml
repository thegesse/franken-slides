name: Docker-test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest

    env:
      POSTGRES_DB: db_ci
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci_password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build backend JAR
        working-directory: backend
        run: bash ./mvnw clean package -DskipTests

      - name: Build Docker images
        run: docker compose build backend frontend

      - name: Start services
        run: docker compose up -d --wait
      
      - name: Check backend responds
        run: |
          status=$(curl --retry 30 --retry-all-errors --retry-delay 2 \
            --retry-max-time 60 -sS -o /dev/null -w '%{http_code}' \
            http://localhost:8080/api/v1/auth/login)
          test "$status" = "405"
      
      - name: Check frontend responds
        run: |
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 \
            --retry-max-time 60 http://localhost:5173/ -o /dev/null

      - name: Stop services
        if: always()
        run: docker compose down --volumes